[package]
name = "prism-transcribe-app"
description = "Prism Transcribe's desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "prism-transcribe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The Windows notification when the batch queue finishes (T8), sent from Rust only.
tauri-plugin-notification = "2"
prism-transcribe-core.workspace = true
prism-transcribe-speech.workspace = true
prism-transcribe-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
