[package]
name = "prism-transcribe-bench"
description = "Phase 0 benchmark: run the light pack on a recording and report speed, memory and, with a truth file, accuracy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
prism-transcribe-speech.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
