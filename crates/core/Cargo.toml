[package]
name = "prism-transcribe-core"
description = "Prism Transcribe's data model, projects and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
# Password protection (open decision 7): RustCrypto's Argon2id and XChaCha20-Poly1305.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
