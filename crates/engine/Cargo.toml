[package]
name = "prism-transcribe-engine"
description = "Import, transcribe and export: the parts of Prism Transcribe joined up, for the app and the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "prism-transcribe-cli"
path = "src/main.rs"

[dependencies]
prism-transcribe-core.workspace = true
prism-transcribe-speech.workspace = true
prism-transcribe-media.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Windows' own spell checker (ISpellChecker), for the de-identification suggestions pass. The same version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
